[project]
name = "hypevolve"
version = "0.1.0"
description = "GA orchestration of CLI coding agents for performance-driven software improvement"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "scipy>=1.13"]

[project.scripts]
hypevolve = "hypevolve.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hypevolve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["results", "targets", "experiments", "workspaces"]
markers = ["slow: end-to-end smoke tests (deselect with '-m \"not slow\"')"]
